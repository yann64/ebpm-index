[package]
name = "gui"
description = "The shared contract for eBasic's universal, cross-toolkit Application/Window/StatusBar/Timer/Menu/Toolbar/Action/Button/Label/Entry/Box/Grid/CheckBox/RadioButton/ComboBox/ProgressBar/Slider/ListBox/TextView GUI API, plus per-child layout constraints (expand/align/weight/min-max-size) - twenty TYPE shapes every backend adapter implements identically. No native dependency; implements nothing itself. See gui-gtk4/gui-qt6/gui-haiku for real backend adapters."

