[package]
name = "gui-gtk4"
description = "The GTK4 backend adapter for eb-gui, eBasic's universal cross-toolkit Application/Window/StatusBar/Timer GUI API - implements the eb-gui contract by calling into eb-gtk4. One tiny native shim bridges GTK4's close-request signal shape/polarity to the contract's own."

[[versions]]
version = "0.1.0"
git = "https://github.com/yann64/eb-gui-gtk4"
tag = "v0.1.0"

