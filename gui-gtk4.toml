[package]
name = "gui-gtk4"
description = "The GTK4 backend adapter for eb-gui, eBasic's universal cross-toolkit Application/Window/StatusBar/Timer/Menu/Toolbar/Action/Button/Label/Entry/Box/Grid GUI API, plus per-child layout constraints (expand/align/weight/min-max-size) - implements the eb-gui contract by calling into eb-gtk4. Two tiny native shims bridge GTK4's close-request/action-activate signal shapes to the contract's own."

