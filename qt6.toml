[package]
name = "qt6"
description = "A Qt6 Widgets binding for eBasic (hand-written extern \"C\" shim over real Qt6 C++ classes, matching eb-haiku's architecture) - QApplication, widgets, signals, custom drawing, checkboxes/radio buttons, combo boxes, text edit, menus, tabs, lists/tables, dialogs, sliders/spin boxes, progress/status bars, trees, scroll areas/splitters, tool bars, stacked widgets, color/font dialogs, dials/LCD numbers, dock widgets, grid/form layouts, button groups, system tray, date/time/calendar, timers, clipboard, input dialogs, style sheets, settings, shortcuts, validators, completers, icons, action groups, tooltips, frames, images, rich text, size constraints, focus control."

