[package]
name = "gui-haiku"
description = "The native BWindow (Haiku BeAPI) backend adapter for eb-gui, eBasic's universal cross-toolkit Application/Window/StatusBar/Timer/Menu/Toolbar/Action/Button/Label/Entry/Box/Grid/CheckBox/RadioButton/ComboBox/ProgressBar/Slider/ListBox/TextView GUI API, plus per-child layout constraints (expand/align/weight/min-max-size) - implements the eb-gui contract by calling into eb-haiku, with no native code of its own needed (all prerequisite native additions, including BListView/BStringItem, live in eb-haiku itself)."

