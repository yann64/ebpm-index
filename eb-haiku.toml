[package]
name = "eb-haiku"
description = "A binding for Haiku OS's own native API (Storage/Support/Interface/Translation/Application/Network/Locale/Package/Media/Device Kits, Kernel Kit concurrency, printing, live filesystem/clipboard watching, TLS/UDP networking) for eBasic - real only on Haiku hardware."

